name: build-herz-hook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [ arm64-v8a ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK r25b
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.2.9519653" >/dev/null 2>&1
          echo "NDK=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Configure (${matrix.abi})
        run: |
          NDK="$NDK"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (${matrix.abi})
        run: |
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cmake --build build --config Release -j$(nproc)

      - name: Upload artifact (${matrix.abi})
        uses: actions/upload-artifact@v4
        with:
          name: herz-hook-${{ matrix.abi }}
          path: build/libherz_hook.so
          if-no-files-found: error
